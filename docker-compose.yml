services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mandrac
      POSTGRES_PASSWORD: mandrac
      POSTGRES_DB: mandrac_loyalty
      TZ: Europe/Zagreb
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandrac -d mandrac_loyalty"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://mandrac:mandrac@db:5432/mandrac_loyalty?schema=public
      JWT_SECRET: change-me-in-production-mandrac-demo-secret
      PORT: 4000
      PUBLIC_APP_URL: http://localhost:8080
      TZ: Europe/Zagreb
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  client:
    build: ./client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  db-data:
